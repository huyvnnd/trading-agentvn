[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent-vnstock"
version = "2.0.0"
description = "Vietnam Quantitative Multi-Agent Hedge Fund & Algorithmic Trading Platform (TradingAgents, ai-hedge-fund, FinRL, FinRobot, Minervini SEPA, VSA/SMC, Spec Kit SDD)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Antigravity Quantitative Investment Committee"}
]
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "ta>=0.11.0",
    "psutil>=5.9.0",
]

[project.scripts]
trading-agent = "trading_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_agent*"]
